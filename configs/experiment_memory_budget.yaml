video:
  video_id: KbahC-QCKU8
  filename: KbahC-QCKU8.mp4

paths:
  raw_dir: data/raw
  derived_dir: data/experiments/F8_ASR
  annotations_dir: data/annotations
  # same frozen F8_ASR observations; runs are rebuilt automatically when the memory
  # code, budgets or memory_input change (their signatures differ)
  runs_dir: runs/experiments/F8_ASR
  report_generated_dir: report/generated

models:
  vlm:
    backend: transformers
    model_id: Qwen/Qwen3-VL-4B-Instruct
    dtype: auto
    device_map: auto
    max_new_tokens: 1024
  llm:
    backend: transformers
    model_id: Qwen/Qwen3-VL-4B-Instruct
    dtype: auto
    device_map: auto
    max_new_tokens: 512
  embedder: sentence-transformers
  embedder_model: sentence-transformers/all-MiniLM-L6-v2
  tokenizer: auto

questions:
  filename: questions_v2.yaml   # audited set; questions.yaml (v1) is kept for the earlier results

memory_input:
  speech: both
  max_transcript_chars: 600

budgets:
  mode: fraction
  values: {B1: 0.10, B2: 0.25, B3: 0.50}

retrieval:
  budget_tokens: 1500
  top_k: 40
  entity_boost: 0.25
  temporal_boost: 0.20

experiment:
  conditions: [C2, C3, C4]           # C1 is excluded: its update cost is O(n*B), ~15 h at B1
  ablations: [no_resolution, no_state_changes, no_compression, no_debounce]
  ablation_budget: B2
  split: test

seed: 0
